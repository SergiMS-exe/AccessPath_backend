name: Build and publish Docker image

# Build + push a GitHub Container Registry en cada push a main.
# Imagen resultante: ghcr.io/<owner>/accesspath-backend:main y :<sha-corto>
#
# Autenticacion: usa el GITHUB_TOKEN automatico del runner, con permisos
# de `packages: write` concedidos abajo. Sin secrets externos.

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # github.repository = "<owner>/<repo>", que es exactamente lo que usa ghcr
  # como namespace. Asi la imagen queda en
  # ghcr.io/sergims-exe/accesspath-backend (o el owner que sea).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # SHA corto del commit -> :<sha>, ideal para pin versiones exactas.
            type=sha,format=short
            # :main para "lo ultimo estable".
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache por sha en ghcr para acelerar builds siguientes.
          cache-from: type=gha
          cache-to: type=gha,mode=max