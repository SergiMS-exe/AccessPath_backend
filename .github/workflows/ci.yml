name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: '1.25'
  GOLANGCI_LINT_VERSION: 'v1.62.2'

jobs:
  ci:
    name: build / test / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "Archivos sin formato:"
            gofmt -l .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -race -count=1 -timeout=120s

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Verificar Swagger sincronizado
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.3
          swag init -g cmd/server/main.go -o /tmp/swag-docs
          if ! diff -r docs /tmp/swag-docs --exclude='*.md' --brief; then
            echo "docs/ esta desincronizado. Ejecuta 'swag init -g cmd/server/main.go' y commitea."
            exit 1
          fi
